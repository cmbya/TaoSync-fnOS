name: Build TaoSync fnOS FPK

on:
  push:
    branches: [main]
    paths:
      - package-template/manifest
      - scripts/build_fpk.sh
      - .github/workflows/build-taosync-fpk.yml
  workflow_dispatch:
    inputs:
      version:
        description: "可选：手动指定 TaoSync 版本，例如 v0.4.0；留空则使用上游最新正式版"
        required: false
        type: string
  schedule:
    # GitHub cron 使用 UTC。每天 00:51 UTC（北京时间 08:51）检查一次。
    - cron: "51 0 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 获取目标版本
        id: version
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${MANUAL_VERSION:-}" ]; then
            TAG="$MANUAL_VERSION"
            case "$TAG" in v*) ;; *) TAG="v$TAG" ;; esac
          else
            TAG="$(python3 - <<'PY'
          import json, urllib.request
          req = urllib.request.Request(
              'https://api.github.com/repos/dr34m-cn/taosync/releases/latest',
              headers={'Accept':'application/vnd.github+json','User-Agent':'TaoSync-fnOS-builder'}
          )
          with urllib.request.urlopen(req, timeout=30) as r:
              print(json.load(r)['tag_name'])
          PY
          )"
          fi
          VERSION="${TAG#v}"
          RELEASE_TAG="fnos-${TAG}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "目标上游版本: $TAG"

      - name: 检查是否已经发布
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "已经存在 $RELEASE_TAG，本次无需重复构建。"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 验证上游 StaticX amd64 发布文件
        if: steps.existing.outputs.exists != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          tag = os.environ['TAG']
          version = os.environ['VERSION']
          expected = f'taoSync-v{version}-linux-StaticX-amd64.zip'
          url = f'https://api.github.com/repos/dr34m-cn/taosync/releases/tags/{tag}'
          req = urllib.request.Request(
              url,
              headers={'Accept':'application/vnd.github+json','User-Agent':'TaoSync-fnOS-builder'}
          )
          with urllib.request.urlopen(req, timeout=30) as r:
              release = json.load(r)
          names = [a.get('name','') for a in release.get('assets', [])]
          if expected not in names:
              print('上游 Release 中没有找到需要的文件:', expected)
              print('实际 assets:')
              for n in names:
                  print(' -', n)
              raise SystemExit(1)
          print('上游 StaticX amd64 资产可用:', expected)
          PY

      - name: 构建 x86 FPK
        if: steps.existing.outputs.exists != 'true'
        run: |
          chmod +x ./scripts/build_fpk.sh
          ./scripts/build_fpk.sh "${{ steps.version.outputs.tag }}"

      - name: 上传 Actions 构建产物
        if: steps.existing.outputs.exists != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: TaoSync-${{ steps.version.outputs.version }}-fnOS-x86
          path: |
            dist/*.fpk
            dist/SHA256SUMS.txt
          retention-days: 30

      - name: 创建 GitHub Pre-release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          UPSTREAM_TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cat > /tmp/release-notes.md <<EOF2
          自动检测到上游 TaoSync **${UPSTREAM_TAG}**，并生成 fnOS x86 原生 FPK。

          - 上游版本：${UPSTREAM_TAG}
          - 架构：x86 / amd64
          - Docker：不使用
          - 上游程序：官方 Linux StaticX amd64
          - Web 端口：8023
          - 升级：保留 TaoSync 数据库、配置和任务数据

          **这是自动构建的 Pre-release。建议先在飞牛上覆盖升级测试，确认同步任务正常后再把本 Release 改成正式版。**
          EOF2

          gh release create "$RELEASE_TAG" \
            dist/*.fpk dist/SHA256SUMS.txt \
            --title "TaoSync ${VERSION} fnOS x86" \
            --notes-file /tmp/release-notes.md \
            --prerelease
